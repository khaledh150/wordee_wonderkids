<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF5F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English & Math" />
    <meta name="description" content="International English Spelling &amp; Math Championship" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>International English Spelling &amp; Math Championship</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <noscript>
      <div style="text-align:center;padding:40px;font-family:system-ui">
        <h2>WonderKids Championship</h2>
        <p>Please enable JavaScript to use this app.</p>
      </div>
    </noscript>
    <script>
    (function(){
      var KEY='chunk_reload',count=parseInt(sessionStorage.getItem(KEY)||'0',10);
      function nuke(){
        if(count>=2){sessionStorage.removeItem(KEY);return}
        sessionStorage.setItem(KEY,String(count+1));
        Promise.all([
          navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}):0,
          window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}):0
        ]).then(function(){location.reload()}).catch(function(){location.reload()})
      }
      window.addEventListener('error',function(e){
        var m=e.message||'';
        if(m.indexOf('MIME')>-1||m.indexOf('dynamically imported')>-1||m.indexOf('module script')>-1){e.preventDefault();nuke()}
        else{document.getElementById('root').innerHTML='<div style="text-align:center;padding:40px;font-family:system-ui"><h2>WonderKids Championship</h2><p>Loading error. Please refresh.</p><p style="font-size:12px;color:#999">'+m+'</p><button onclick="location.reload()" style="margin-top:16px;padding:8px 24px;font-size:16px">Reload</button></div>'}
      });
      window.addEventListener('unhandledrejection',function(e){
        var m=e.reason&&e.reason.message||String(e.reason||'');
        if(m.indexOf('dynamically imported')>-1||m.indexOf('MIME')>-1||m.indexOf('Failed to fetch')>-1){e.preventDefault();nuke()}
      });
      if(count>0)sessionStorage.removeItem(KEY);
    })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
